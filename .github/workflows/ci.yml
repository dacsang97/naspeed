name: ci

# Pull requests only: a push trigger would run CI twice for every PR branch.
# release.yml calls this for main and dispatches it for the Release PR.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # naspeed caches its own build; only pushes to main save the store.
      - uses: dacsang97/naspeed-action@v1
        with:
          cache-key: clippy
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      # The released naspeed caches the build; only pushes to main save the
      # store.
      - uses: dacsang97/naspeed-action@v1
        with:
          cache-key: test
      # The tests run under the naspeed built from this commit, so its test
      # runner and tracer are the ones being tested (a released naspeed would
      # test the PR with last release's runner). Unit tests, plus the input
      # tracking suite: the rest of tests/ needs Docker, zig and reflink
      # filesystems that hosted runners do not provide.
      - run: cargo build --locked --bin naspeed
      - run: ./target/debug/naspeed test --locked --lib --bins --test test_input_tracking
      # Windows also runs setup/uninstall and the wrapper end to end (store,
      # restore into a second target dir, freshness) on the fixture
      # workspace, whose registry crates the tests build offline.
      - if: runner.os == 'Windows'
        run: cargo fetch --locked --manifest-path tests/fixtures/sample_workspace/Cargo.toml
      - if: runner.os == 'Windows'
        run: ./target/debug/naspeed test --locked --test setup_uninstall --test materialize_integration
      # Also compiles the other integration tests, through the same store.
      - run: cargo check --locked --all-targets

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      # naspeed caches its own build; only pushes to main save the store.
      - uses: dacsang97/naspeed-action@v1
        with:
          cache-key: package
      - run: cargo publish --dry-run --locked
