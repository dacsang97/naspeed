name: ci

# Pull requests only: a push trigger would run CI twice for every PR branch.
# release.yml calls this for main and dispatches it for the Release PR.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # naspeed caches its own build; only pushes to main save the store.
      - uses: dacsang97/naspeed-action@v1
        with:
          cache-key: clippy
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      # naspeed caches its own build; only pushes to main save the store.
      - uses: dacsang97/naspeed-action@v1
        with:
          cache-key: test
      - run: cargo check --locked --all-targets
      # Unit tests only: the integration suite in tests/ needs Docker, zig and
      # reflink filesystems that hosted runners do not provide.
      # `naspeed test` replays test binaries unchanged since a passing run.
      - run: naspeed test --locked --lib --bins
      - run: naspeed stats

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      # naspeed caches its own build; only pushes to main save the store.
      - uses: dacsang97/naspeed-action@v1
        with:
          cache-key: package
      - run: cargo publish --dry-run --locked
