name: release

# release-plz keeps a Release PR open with the next version and changelog.
# Merging it publishes to crates.io, tags v<version>, creates the GitHub
# release and hands the tag to release-binaries.yml (archives + Homebrew).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  release-pr:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Create or update Release PR
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          version: 0.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # PRs opened with GITHUB_TOKEN do not trigger pull_request workflows.
      - name: Run CI for Release PR
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
        run: gh workflow run ci.yml --ref "$RELEASE_BRANCH"

  publish:
    needs: ci
    if: vars.CRATES_IO_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    concurrency:
      group: release-plz-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # The first publish of a new crate needs a token; afterwards crates.io
      # trusted publishing can replace it.
      - name: Publish merged Release PR with registry token
        id: release-token
        if: env.HAS_REGISTRY_TOKEN == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release
          version: 0.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish merged Release PR with trusted publishing
        id: release-oidc
        if: env.HAS_REGISTRY_TOKEN != 'true'
        uses: release-plz/action@v0.5
        with:
          command: release
          version: 0.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Read release tag
        id: tag
        env:
          CREATED: ${{ steps.release-token.outputs.releases_created || steps.release-oidc.outputs.releases_created }}
          RELEASES: ${{ steps.release-token.outputs.releases || steps.release-oidc.outputs.releases }}
        run: |
          if [ "$CREATED" = "true" ]; then
            echo "tag=$(jq -r '.[0].tag' <<<"$RELEASES")" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    needs: publish
    if: needs.publish.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
