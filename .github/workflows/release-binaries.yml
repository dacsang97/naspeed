name: release-binaries

# Builds the release archives for an existing tag, attaches them to its GitHub
# release and updates the formula in dacsang97/homebrew-tap. Called by
# release.yml after a crates.io publish; run it by hand to retry a tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15, cargo: build }
          - { target: x86_64-apple-darwin, os: macos-15, cargo: build }
          # Static musl binaries run on any Linux, including Homebrew on Linux.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, cargo: zigbuild }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04, cargo: zigbuild }
          # Zip archives with naspeed.exe for the naspeed-action and manual installs.
          - { target: x86_64-pc-windows-msvc, os: windows-2025, cargo: build }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, cargo: build }
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cargo == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - if: matrix.cargo == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          # 0.24 drops rustc's -Wl,--fix-cortex-a53-843419, which zig's linker
          # rejects on aarch64-unknown-linux-musl.
          tool: cargo-zigbuild@0.24.0
      - run: cargo ${{ matrix.cargo }} --locked --release --target "$TARGET"
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' && matrix.target != 'aarch64-unknown-linux-musl'
        run: |
          "target/$TARGET/release/naspeed" --version | tr -d '\r' | grep -Fx "naspeed ${TAG#v}"
      - name: Package
        run: |
          name="naspeed-$TAG-$TARGET"
          mkdir "$name"
          cp LICENSE NOTICE README.md "$name/"
          if [[ $TARGET == *windows* ]]; then
            cp "target/$TARGET/release/naspeed.exe" "$name/"
            archive="$name.zip"
            pwsh -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$archive'"
            sha256sum "$archive" > "$archive.sha256"
          else
            cp "target/$TARGET/release/naspeed" "$name/"
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  homebrew:
    name: homebrew tap
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; cannot push to dacsang97/homebrew-tap"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TAG" --pattern '*.sha256' --dir checksums
      - uses: actions/checkout@v7
        with:
          repository: dacsang97/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update formula
        run: |
          scripts/homebrew_formula.sh "$TAG" checksums > tap/naspeed.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naspeed.rb
          if git diff --cached --quiet; then
            echo "formula already up to date"
            exit 0
          fi
          git commit -m "Brew formula update for naspeed version $TAG"
          git push
