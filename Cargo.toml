[package]
name = "naspeed"
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/dacsang97/naspeed"
homepage = "https://dacsang97.github.io/naspeed/"
description = "Transparent RUSTC_WRAPPER that caches registry crate artifacts once per volume and clones them copy-on-write into every target/ dir"
readme = "README.md"
keywords = ["cargo", "cache", "rustc-wrapper", "build", "copy-on-write"]
categories = ["development-tools::build-utils", "development-tools::cargo-plugins", "caching"]
include = ["/src/**", "/trace/**", "/build.rs", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
anyhow = "1"
ansi-to-tui = "8.0.1"
base64 = "0.23.1"
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29"] }
blake3 = "1.8"
cargo-config2 = "0.1"
cargo-zigbuild = "0.24"
dunce = "1"
clap = { version = "4.6", features = ["derive"] }
filetime = "0.2"
flate2 = "1.1"
ignore = "0.4"
notify = "8.2"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tiny_http = "0.12"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
ureq = "3.5"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 4
